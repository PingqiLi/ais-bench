blank_issues_enabled: false  # 禁止空白 Issue，强制使用模板
templates:
  - name: 👉 遇到问题先看这里
    about: 这里也许能快速解决您的问题
    file: a_guide.yml
  - name: 🔧 Bug 报告
    about: 提交程序中的错误或异常
    file: bug.yml
    labels: ["bug", "待处理"]  # 自动添加标签
  - name: ❓ 使用疑问
    about: 咨询工具使用过程中的问题
    file: consult.yml
    labels: ["question", "待回复"]
  - name: 📃 文档问题
    about: 反馈文档中的错误或需要补充的内容
    file: doc.yml
    labels: ["documentation", "待更新"]
  - name: 🔬 功能需求
    about: 提出新功能建议或现有功能优化
    file: feature.yml
    labels: ["enhancement", "需求讨论"]

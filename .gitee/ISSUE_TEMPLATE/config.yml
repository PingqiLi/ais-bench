blank_issues_enabled: false  # 禁止空白 Issue，强制使用模板
contact_links:
  - name: Gitee 帮助中心
    url: https://help.gitee.com/
    about: 提供 Git 使用指南、教程、Gitee.com 平台基本功能使用、介绍和常见问题解答
  - name: 技术支持
    url: https://help.gitee.com/
    about: 联系技术支持团队
templates:
  - name: Bug 报告
    about: 提交程序中的错误或异常
    file: bug.yml
    labels: ["bug", "待处理"]  # 自动添加标签
  - name: 功能需求
    about: 提出新功能建议或现有功能优化
    file: feature.yml
    labels: ["enhancement", "需求"]
  - name: 文档问题
    about: 反馈文档中的错误或需要补充的内容
    file: doc.yml
    labels: ["documentation"]